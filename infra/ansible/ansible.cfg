[defaults]
inventory = inventario.ini
# El servidor se recrea con Terraform: su llave de host cambia y no hay que aceptarla a mano.
host_key_checking = False
# Pide la contraseña del vault (o define ANSIBLE_VAULT_PASSWORD_FILE).
ask_vault_pass = True
interpreter_python = /usr/bin/python3
stdout_callback = default
result_format = yaml
retry_files_enabled = False
timeout = 30

[ssh_connection]
pipelining = True
