# nodejs: Node.js {{ nodejs_version }} desde el repositorio oficial de NodeSource.

- name: Llave de NodeSource
  ansible.builtin.get_url:
    url: https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
    dest: /etc/apt/keyrings/nodesource.asc
    mode: "0644"

- name: Repositorio de NodeSource
  ansible.builtin.apt_repository:
    repo: "deb [signed-by=/etc/apt/keyrings/nodesource.asc] https://deb.nodesource.com/node_{{ nodejs_version }}.x nodistro main"
    filename: nodesource
    state: present

- name: Instalar Node.js
  ansible.builtin.apt:
    name: nodejs
    state: present
    update_cache: true

- name: Versión de Node
  ansible.builtin.command: node --version
  register: nodejs_instalado
  changed_when: false

- name: Comprobar la versión mayor
  ansible.builtin.assert:
    that: nodejs_instalado.stdout is match('v' ~ nodejs_version ~ '\\.')
    fail_msg: "Se esperaba Node {{ nodejs_version }} y hay {{ nodejs_instalado.stdout }}"
    quiet: true
