# =====================================================================
# CI de EntradasYa · auth  (registro, login y JWT (RS256))
#
# Se ejecuta en cada push a "development" (y en Pull Requests hacia main/development,
# o a mano desde la pestaña Actions).
#
#   verificar ──► empaquetar
#   lint, build,   .zip listo para desplegar
#   pruebas y      (artifact descargable en el resumen
#   prueba de      de la ejecución)
#   humo
# =====================================================================
name: CI auth

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# Si llegan dos push seguidos a la misma rama, se cancela la ejecución vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVICIO: auth
  NODE_VERSION: '22'
  PORT: '3001'

jobs:
  verificar:
    name: Lint, build y pruebas
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Base de datos de verdad para probar las migraciones y que el servicio arranque.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: auth_user
          POSTGRES_PASSWORD: auth_pass
          POSTGRES_DB: auth_db
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U auth_user -d auth_db"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci   # el postinstall genera el cliente de Prisma

      - name: Lint (oxlint)
        run: npm run lint

      - name: Build (TypeScript → dist/)
        run: npm run build

      - name: Pruebas unitarias (vitest)
        run: npm test

      - name: Preparar el entorno de prueba
        run: |
          cp .env.example .env
          mkdir -p "$RUNNER_TEMP/keys" "$RUNNER_TEMP/storage"
          # Llaves RS256 de un solo uso, solo para esta ejecución.
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 -out "$RUNNER_TEMP/keys/jwt-private.pem" 2>/dev/null
          openssl rsa -in "$RUNNER_TEMP/keys/jwt-private.pem" -pubout -out "$RUNNER_TEMP/keys/jwt-public.pem" 2>/dev/null
          echo "JWT_PUBLIC_KEY_PATH=$RUNNER_TEMP/keys/jwt-public.pem" >> "$GITHUB_ENV"
          echo "JWT_PRIVATE_KEY_PATH=$RUNNER_TEMP/keys/jwt-private.pem" >> "$GITHUB_ENV"

      - name: Aplicar las migraciones en una base vacía
        run: npx prisma migrate deploy

      - name: Prueba de humo (el servicio arranca y GET /health responde 200)
        run: |
          node dist/main.js > servicio.log 2>&1 &
          for _ in $(seq 1 30); do
            if curl -fsS "http://localhost:$PORT/health"; then
              echo; echo "OK: $SERVICIO responde en el puerto $PORT"
              exit 0
            fi
            sleep 1
          done
          echo "::error::$SERVICIO no respondió /health en 30 s"
          cat servicio.log
          exit 1

  empaquetar:
    name: Generar artifact
    needs: verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias y compilar
        run: |
          npm ci
          npm run build

      - name: Armar el paquete
        id: paquete
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          NOMBRE="entradasya-$SERVICIO-$VERSION-$SHA"
          mkdir -p paquete
          cp -r dist package.json package-lock.json .env.example README.md prisma prisma.config.ts paquete/
          find paquete -name '*.tsbuildinfo' -delete
          # Información de la compilación (qué commit, qué rama, cuándo).
          {
            echo "servicio:  $SERVICIO"
            echo "version:   $VERSION"
            echo "commit:    $GITHUB_SHA"
            echo "rama:      $GITHUB_REF_NAME"
            echo "fecha:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node:      $(node -v)"
            echo "ejecucion: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > paquete/BUILD_INFO.txt
          # GitHub comprime la carpeta: se descarga como $NOMBRE.zip
          # Para instalarlo en el servidor:
          #   unzip $NOMBRE.zip -d $SERVICIO && cd $SERVICIO
          #   npm ci --omit=dev --ignore-scripts
          #   npx prisma migrate deploy   (con DATABASE_URL)
          #   node dist/main.js
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          du -sh paquete
          ls -la paquete

      - name: Subir el artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.paquete.outputs.nombre }}
          path: paquete/
          retention-days: 30
          if-no-files-found: error

      - name: Resumen
        env:
          NOMBRE: ${{ steps.paquete.outputs.nombre }}
        run: |
          {
            echo "### Artifact de $SERVICIO"
            echo
            echo "Se descarga como **\`$NOMBRE.zip\`** ($(du -sh paquete | cut -f1) sin comprimir) desde la sección **Artifacts** de esta ejecución. Se guarda 30 días."
            echo
            echo "Contenido:"
            echo '```'
            ls -1 paquete
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
