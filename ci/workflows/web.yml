# =====================================================================
# CI de EntradasYa · web  (interfaz en React + Vite)
#
# Se ejecuta en cada push a "development" (y en Pull Requests hacia main/development,
# o a mano desde la pestaña Actions).
#
#   verificar ──► empaquetar
#   lint, build,   .zip listo para desplegar
#   pruebas y      (artifact descargable en el resumen
#   prueba de      de la ejecución)
#   humo
# =====================================================================
name: CI web

on:
  push:
    branches: [development]
  pull_request:
    branches: [main, development]
  workflow_dispatch:

# Si llegan dos push seguidos a la misma rama, se cancela la ejecución vieja.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SERVICIO: web
  NODE_VERSION: '22'

jobs:
  verificar:
    name: Tipos, build y prueba de humo
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Revisar tipos (tsc)
        run: npm run typecheck

      - name: Build de producción (vite build → dist/)
        run: npm run build

      - name: Prueba de humo (la página carga)
        env:
          EY_HTTPS: 'false'
        run: |
          npx vite preview --port 4173 --strictPort > preview.log 2>&1 &
          for _ in $(seq 1 20); do
            if curl -fsS http://localhost:4173/ | grep -q '<div id="root">'; then
              echo "OK: la web responde"
              exit 0
            fi
            sleep 1
          done
          echo "::error::vite preview no respondió"
          cat preview.log
          exit 1

  empaquetar:
    name: Generar artifact
    needs: verificar
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Descargar el código
        uses: actions/checkout@v6

      - name: Instalar Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Instalar dependencias y compilar
        run: |
          npm ci
          npm run build

      - name: Armar el paquete
        id: paquete
        run: |
          VERSION=$(node -p "require('./package.json').version")
          SHA=${GITHUB_SHA::7}
          NOMBRE="entradasya-$SERVICIO-$VERSION-$SHA"
          mkdir -p paquete
          cp -r dist/. paquete/
          find paquete -name '*.tsbuildinfo' -delete
          # Información de la compilación (qué commit, qué rama, cuándo).
          {
            echo "servicio:  $SERVICIO"
            echo "version:   $VERSION"
            echo "commit:    $GITHUB_SHA"
            echo "rama:      $GITHUB_REF_NAME"
            echo "fecha:     $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "node:      $(node -v)"
            echo "ejecucion: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          } > paquete/BUILD_INFO.txt
          # GitHub comprime la carpeta: se descarga como $NOMBRE.zip
          # Para instalarlo en el servidor:
          #   unzip $NOMBRE.zip -d $SERVICIO && cd $SERVICIO
          #   (el contenido es la web: se copia a la carpeta que sirve Nginx)
          #   (es estático: no hace falta Node en el servidor)
          echo "nombre=$NOMBRE" >> "$GITHUB_OUTPUT"
          du -sh paquete
          ls -la paquete

      - name: Subir el artifact
        uses: actions/upload-artifact@v6
        with:
          name: ${{ steps.paquete.outputs.nombre }}
          path: paquete/
          retention-days: 30
          if-no-files-found: error

      - name: Resumen
        env:
          NOMBRE: ${{ steps.paquete.outputs.nombre }}
        run: |
          {
            echo "### Artifact de $SERVICIO"
            echo
            echo "Se descarga como **\`$NOMBRE.zip\`** ($(du -sh paquete | cut -f1) sin comprimir) desde la sección **Artifacts** de esta ejecución. Se guarda 30 días."
            echo
            echo "Contenido:"
            echo '```'
            ls -1 paquete
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
